<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css">
  <title>Dev Cockpit</title>
</head>
<body>
  <header class="topbar"><div><p class="eyebrow">REMOTE DEVELOPMENT CONSOLE</p><h1>Dev Cockpit</h1></div><div class="topbar-tools"><input id="token" type="password" autocomplete="off" placeholder="API token（任意）"><div id="connection" class="connection offline">PC ● 確認中</div></div></header>
  <main class="layout">
    <section class="card new-task"><div class="section-heading"><h2>New task</h2><span class="muted">専用worktreeで実行</span></div>
      <label>Project<select id="project"></select></label>
      <div class="agent-picker" id="agent-picker"><span class="muted">Agentを読み込んでいます…</span></div>
      <label>Prompt<textarea id="prompt" rows="6" placeholder="READMEを現在の構成に合わせて更新して…"></textarea></label><button id="run" class="primary">Run</button><p id="task-error" class="error" role="alert"></p>
    </section>
    <section class="card running"><div class="section-heading"><h2>Jobs</h2><button id="refresh" class="quiet">更新</button></div><div id="jobs" class="job-list"><p class="muted">Jobを読み込んでいます…</p></div></section>
    <section id="detail" class="card detail hidden"><div class="section-heading"><div><p class="eyebrow">JOB DETAIL</p><h2 id="detail-title">Job</h2></div><span id="detail-status" class="status"></span></div>
      <div id="detail-meta" class="meta"></div><div class="detail-actions"><button id="stop" class="danger">Stop</button><button id="request-changes" class="secondary">Request changes</button><button id="approve" class="secondary">Approve / commit</button><button id="push" class="secondary">Push</button><button id="discard" class="quiet danger-text">Discard worktree</button></div>
      <label id="follow-up-box" class="hidden">修正指示<textarea id="follow-up" rows="3" placeholder="この差分を修正して…"></textarea></label>
      <div class="tabs"><button class="tab active" data-tab="log">Log</button><button class="tab" data-tab="diff">Git diff</button><button class="tab" data-tab="markdown">Markdown</button></div>
      <pre id="log" class="panel-content"></pre><pre id="diff" class="panel-content hidden"></pre><div id="markdown" class="panel-content markdown hidden"><p class="muted">差分のMarkdownファイルを選択してください。</p></div>
    </section>
  </main><script src="/app.js"></script>
</body>
</html>
